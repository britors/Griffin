[package]
name = "griffin-music"
version = "3.0.1"
description = "Separação de stems e prática instrumental"
authors = ["W3TI"]
edition = "2021"
default-run = "griffin-music"

[features]
default = ["gui"]
gui = ["dep:tauri", "dep:tauri-build", "dep:keyring", "dep:tauri-plugin-process", "dep:tauri-plugin-updater"]

[lib]
name = "griffin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
rfd = "0.15"
hound = "3.5"
ort = "2.0.0-rc.13"
symphonia = { version = "0.5", features = ["all"] }
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }
sha2 = "0.10"
hex = "0.4"
url = "2.5"
tokio = { version = "1", features = ["macros", "process", "io-util", "sync", "time"] }
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"], optional = true }
tauri-plugin-process = { version = "2.3.1", optional = true }
tauri-plugin-updater = { version = "2.10.1", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
ort = { version = "2.0.0-rc.13", features = ["cuda"] }

[target.'cfg(target_os = "linux")'.dependencies]
tar = "0.4"
xz2 = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[[bin]]
name = "griffin-music"
path = "src/main.rs"

[[bin]]
name = "griffin-onnx-worker"
path = "src/bin/griffin-onnx-worker.rs"
