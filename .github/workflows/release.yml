name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            package_command: npm run package:linux
          - os: windows-latest
            package_command: npm run package:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - run: npm run validate:tauri
      - run: ${{ matrix.package_command }}
      - name: Validate Linux packages
        if: runner.os == 'Linux'
        run: npm run validate:packages
      - name: Validate Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/validate-windows-build.ps1
      - name: Validate Windows package layout
        if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/validate-packages.sh release windows
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ runner.os }}
          path: release/*
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
