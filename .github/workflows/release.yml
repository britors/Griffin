name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            package_command: npm run package:linux
          - os: windows-latest
            package_command: npm run package:win
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwayland-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            rpm
      - run: npm ci
      - run: npm run validate:version
      - run: npm run validate:tauri
      - run: npm run test:updater-manifest
      - name: Validate updater signing secret
        run: node -e "if (!process.env.TAURI_SIGNING_PRIVATE_KEY) { console.error('TAURI_SIGNING_PRIVATE_KEY is required'); process.exit(1) }"
      - run: ${{ matrix.package_command }}
      - name: Validate Linux packages
        if: runner.os == 'Linux'
        run: npm run validate:packages
      - name: Validate Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/validate-windows-build.ps1
      - name: Validate Windows package layout
        if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/validate-packages.sh release windows
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ runner.os }}
          path: release/*
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Generate updater manifest
        run: node scripts/generate-updater-manifest.mjs release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
